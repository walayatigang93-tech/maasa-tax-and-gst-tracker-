<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maasa Group - Financial, Tax & GST Engine</title>
    <!-- Tailwind CSS Framework CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 Core and DOM Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Runtime Compiler for Browser JSX Compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icon System -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Australian Individual Tax Calculation Utility Function (2025-26 Financial Year Standards)
        function calculateAustralianIncomeTax(taxableIncome) {
            if (taxableIncome <= 18200) return 0;
            
            let baseTax = 0;
            if (taxableIncome <= 45000) {
                baseTax = (taxableIncome - 18200) * 0.16;
            } else if (taxableIncome <= 135000) {
                baseTax = 4288 + (taxableIncome - 45000) * 0.30;
            } else if (taxableIncome <= 190000) {
                baseTax = 31288 + (taxableIncome - 135000) * 0.37;
            } else {
                baseTax = 51638 + (taxableIncome - 190000) * 0.45;
            }

            // Medicare Levy calculation (Standard 2% of total taxable income)
            const medicareLevy = taxableIncome > 27222 ? taxableIncome * 0.02 : 0;
            return baseTax + medicareLevy;
        }

        // Auto-assign Financial Quarters Based on Australian Accounting Calendar (July to June)
        function deriveAccountingQuarter(dateString) {
            const date = new Date(dateString);
            const month = date.getMonth() + 1; // 1 to 12
            if (month >= 7 && month <= 9) return 'Q1';
            if (month >= 10 && month <= 12) return 'Q2';
            if (month >= 1 && month <= 3) return 'Q3';
            return 'Q4';
        }

        function App() {
            // Persistent Client Application State
            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('maasa_financial_data');
                return saved ? JSON.parse(saved) : [];
            });

            // Form Entry Input State Controls
            const [description, setDescription] = useState('');
            const [amount, setAmount] = useState('');
            const [type, setType] = useState('expense'); // 'income' or 'expense'
            const [category, setCategory] = useState('both'); // 'both', 'tax_only', 'personal'
            const [paymentMethod, setPaymentMethod] = useState('card');
            const [entryDate, setEntryDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedQuarterFilter, setSelectedQuarterFilter] = useState('ALL');
            const [receiptImage, setReceiptImage] = useState(null);

            // Sync Application State to Local Browser Storage
            useEffect(() => {
                localStorage.setItem('maasa_financial_data', JSON.stringify(transactions));
                if (window.lucide) { window.lucide.createIcons(); }
            }, [transactions]);

            // Handle Base64 Image Upload
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setReceiptImage(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Register Transaction Entry
            const handleAddTransaction = (e) => {
                e.preventDefault();
                if (!description || !amount || parseFloat(amount) <= 0) return;

                const newTransaction = {
                  id: Date.now().toString(),
                  date: entryDate,
                  description,
                  amount: parseFloat(amount),
                  type,
                  category: type === 'income' ? 'personal' : category,
                  paymentMethod,
                  quarter: deriveAccountingQuarter(entryDate),
                  receiptDataUrl: receiptImage
                };

                setTransactions([newTransaction, ...transactions]);
                setDescription('');
                setAmount('');
                setReceiptImage(null);
            };

            // Remove Single Transaction Record
            const handleDeleteTransaction = (id) => {
                setTransactions(transactions.filter(item => item.id !== id));
            };

            // Filtered Transactions Based on Active UI Selector
            const filteredTransactions = useMemo(() => {
                if (selectedQuarterFilter === 'ALL') return transactions;
                return transactions.filter(t => t.quarter === selectedQuarterFilter);
            }, [transactions, selectedQuarterFilter]);

            // Real-time Computational Financial Engine Aggregates
            const metrics = useMemo(() => {
                let grossIncome = 0;
                let grossExpenses = 0;
                let claimableGstCredit = 0;
                let taxDeductibleExpenses = 0;

                filteredTransactions.forEach(t => {
                    if (t.type === 'income') {
                        grossIncome += t.amount;
                    } else {
                        grossExpenses += t.amount;
                        if (t.category === 'both') {
                            const gstPart = t.amount / 11;
                            claimableGstCredit += gstPart;
                            taxDeductibleExpenses += (t.amount - gstPart);
                        } else if (t.category === 'tax_only') {
                            taxDeductibleExpenses += t.amount;
                        }
                    }
                });

                const netTaxableIncome = Math.max(0, grossIncome - taxDeductibleExpenses);
                const estimatedTaxLiability = calculateAustralianIncomeTax(netTaxableIncome);

                return {
                    grossIncome,
                    grossExpenses,
                    claimableGstCredit,
                    taxDeductibleExpenses,
                    netTaxableIncome,
                    estimatedTaxLiability
                };
            }, [filteredTransactions]);

            return (
                <div className="max-w-5xl mx-auto px-4 py-8">
                    <!-- Header Bar -->
                    <header className="flex flex-col md:flex-row md:items-center md:justify-between bg-slate-900 text-white p-6 rounded-2xl shadow-xl mb-8">
                        <div>
                            <h1 className="text-2xl font-black tracking-tight text-emerald-400">MAASA GROUP</h1>
                            <p className="text-xs text-slate-400 mt-1">Automated GST, Tax & Cashflow Engine</p>
                        </div>
                        <div className="mt-4 md:mt-0 flex items-center gap-2 bg-slate-800 px-4 py-2 rounded-xl border border-slate-700">
                            <i data-lucide="shield-check" className="text-emerald-400 w-5 h-5"></i>
                            <span className="text-xs font-semibold text-slate-300">ATO Tax Year 2025–26 Compliant</span>
                        </div>
                    </header>

                    <!-- Financial Metrics Overview Grid -->
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Gross Income</p>
                            <p className="text-2xl font-black text-slate-800 mt-1">${metrics.grossIncome.toFixed(2)}</p>
                            <span className="text-[10px] text-emerald-600 font-bold bg-emerald-50 px-2 py-0.5 rounded-full mt-2 inline-block">Inbound Cash Flow</span>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Claimable GST (BAS)</p>
                            <p className="text-2xl font-black text-emerald-600 mt-1">${metrics.claimableGstCredit.toFixed(2)}</p>
                            <span className="text-[10px] text-slate-500 font-semibold mt-2 block">1/11th Input Credit Recovery</span>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Tax Deductions</p>
                            <p className="text-2xl font-black text-blue-600 mt-1">${metrics.taxDeductibleExpenses.toFixed(2)}</p>
                            <span className="text-[10px] text-slate-500 font-semibold mt-2 block">Net Deductible Total</span>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Est. Income Tax</p>
                            <p className="text-2xl font-black text-rose-600 mt-1">${metrics.estimatedTaxLiability.toFixed(2)}</p>
                            <span className="text-[10px] text-rose-600 font-bold bg-rose-50 px-2 py-0.5 rounded-full mt-2 inline-block">Inc. 2% Medicare Levy</span>
                        </div>
                    </div>

                    <!-- Filter & Control Panel -->
                    <div className="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-8">
                        <span className="text-xs font-bold text-slate-600">Quarterly Accounting View:</span>
                        <div className="flex gap-1">
                            {['ALL', 'Q1', 'Q2', 'Q3', 'Q4'].map(q => (
                                <button
                                    key={q}
                                    onClick={() => setSelectedQuarterFilter(q)}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${selectedQuarterFilter === q ? 'bg-slate-900 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                                >
                                    {q}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <!-- Transaction Registration Form -->
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-fit">
                            <h2 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                                <i data-lucide="plus-circle" className="w-5 h-5 text-emerald-500"></i>
                                New Entry Registration
                            </h2>
                            <form onSubmit={handleAddTransaction} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Entry Flow Direction</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setType('expense')}
                                            className={`py-2 text-xs font-bold rounded-lg border transition ${type === 'expense' ? 'bg-rose-50 border-rose-500 text-rose-700' : 'border-slate-200 text-slate-600'}`}
                                        >
                                            Outgoing Expense
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setType('income')}
                                            className={`py-2 text-xs font-bold rounded-lg border transition ${type === 'income' ? 'bg-emerald-50 border-emerald-500 text-emerald-700' : 'border-slate-200 text-slate-600'}`}
                                        >
                                            Inbound Income
                                        </button>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Description / Merchant</label>
                                    <input
                                        type="text"
                                        placeholder="e.g., Shell Fuel, Office Supplies"
                                        value={description}
                                        onChange={(e) => setDescription(e.target.value)}
                                        className="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 outline-none"
                                        required
                                    />
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Amount ($ AUD)</label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            placeholder="0.00"
                                            value={amount}
                                            onChange={(e) => setAmount(e.target.value)}
                                            className="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 outline-none"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Transaction Date</label>
                                        <input
                                            type="date"
                                            value={entryDate}
                                            onChange={(e) => setEntryDate(e.target.value)}
                                            className="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 outline-none"
                                            required
                                        />
                                    </div>
                                </div>

                                {type === 'expense' && (
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">ATO Claim Classification</label>
                                        <select
                                            value={category}
                                            onChange={(e) => setCategory(e.target.value)}
                                            className="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg bg-slate-50 font-semibold text-slate-700 outline-none"
                                        >
                                            <option value="both">Both (GST + Income Tax) - Fuel, Repairs</option>
                                            <option value="tax_only">Income Tax Only - Rego, Tolls, Fees</option>
                                            <option value="personal">Personal / Non-Claimable</option>
                                        </select>
                                    </div>
                                )}

                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Payment Method</label>
                                    <select
                                        value={paymentMethod}
                                        onChange={(e) => setPaymentMethod(e.target.value)}
                                        className="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg bg-white outline-none"
                                    >
                                        <option value="card">Bank Account / Debit Card</option>
                                        <option value="wise">Wise Multi-Currency</option>
                                        <option value="zip">Zip Pay / Buy-Now-Pay-Later</option>
                                        <option value="cash">Cash Payment</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">Attach Receipt / Invoice</label>
                                    <input
                                        type="file"
                                        accept="image/*"
                                        onChange={handleImageUpload}
                                        className="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer"
                                    />
                                </div>

                                <button
                                    type="submit"
                                    className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md mt-2"
                                >
                                    Record Financial Entry
                                </button>
                            </form>
                        </div>

                        <!-- Real-time Ledger Log Table -->
                        <div className="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                    <i data-lucide="list-filter" className="w-5 h-5 text-slate-500"></i>
                                    Recorded Ledger Entries
                                </h2>
                                <span className="text-xs font-bold text-slate-400">{filteredTransactions.length} Total Logs</span>
                            </div>

                            {filteredTransactions.length === 0 ? (
                                <div className="text-center py-12 border-2 border-dashed border-slate-100 rounded-xl">
                                    <p className="text-xs text-slate-400 font-medium">No financial transactions recorded for this period.</p>
                                </div>
                            ) : (
                                <div className="space-y-3 max-h-[500px] overflow-y-auto custom-scrollbar pr-1">
                                    {filteredTransactions.map((item) => (
                                        <div key={item.id} className="flex items-center justify-between p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                                            <div className="flex items-center gap-3">
                                                <div className={`p-2 rounded-lg ${item.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                                    <i data-lucide={item.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'} className="w-4 h-4"></i>
                                                </div>
                                                <div>
                                                    <p className="text-xs font-bold text-slate-800">{item.description}</p>
                                                    <div className="flex items-center gap-2 mt-0.5">
                                                        <span className="text-[10px] text-slate-400 font-medium">{item.date} • {item.quarter}</span>
                                                        <span className="text-[10px] bg-slate-200 text-slate-700 font-bold px-1.5 py-0.2 rounded uppercase">{item.paymentMethod}</span>
                                                        {item.type === 'expense' && (
                                                            <span className={`text-[10px] font-bold px-1.5 py-0.2 rounded ${item.category === 'both' ? 'bg-emerald-50 text-emerald-700' : item.category === 'tax_only' ? 'bg-blue-50 text-blue-700' : 'bg-slate-200 text-slate-600'}`}>
                                                                {item.category === 'both' ? 'GST + Tax' : item.category === 'tax_only' ? 'Tax Only' : 'Personal'}
                                                            </span>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <div className="text-right">
                                                    <p className={`text-xs font-black ${item.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}`}>
                                                        {item.type === 'income' ? '+' : '-'}${item.amount.toFixed(2)}
                                                    </p>
                                                    {item.type === 'expense' && item.category === 'both' && (
                                                        <p className="text-[9px] text-emerald-600 font-bold">GST: ${(item.amount / 11).toFixed(2)}</p>
                                                    )}
                                                </div>
                                                <button
                                                    onClick={() => handleDeleteTransaction(item.id)}
                                                    className="p-1.5 text-slate-300 hover:text-rose-600 transition"
                                                    title="Delete Entry"
                                                >
                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
